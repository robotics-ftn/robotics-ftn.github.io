role: Redovni profesor · Rukovodilac laboratorije
bio: |
  Redovni profesor i jedan od troje rukovodilaca Laboratorije za robotiku i mehatroniku na FTN-u. Istraživanja obuhvataju bipednu lokomociju, interakciju čovek–robot, anticipaciju akcija i FTN robot ruku za humanoid MARKO. Član IEEE; bivši postdoktorant na IST/ISR Lisabon (VisLab).
affiliations:
