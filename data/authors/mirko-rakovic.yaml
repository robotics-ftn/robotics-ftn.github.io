bio: |
  Full professor (since 2024) and one of three heads of the Laboratory for Robotics and Mechatronics at the Faculty of Technical Sciences, University of Novi Sad. PhD in robotics at FTN (2013) on synthesis and realization of biped walk using primitives; MSc in electrical and computer engineering (2005) on control of brushed DC motors.

  Research covers humanoid and collaborative robotics, embedded systems, human–robot interaction, and applied AI — from biped locomotion primitives and the FTN robot hand to gaze dialogue and action anticipation, including work as an experienced researcher at IST/ISR Lisbon (VisLab, 2017–2018). Earlier stays include Heidelberg University of Applied Sciences, Nanyang Technological University, and Technikum Wien.

  Principal investigator on projects including Meta-Cobots, a voice-controlled logistics system (H2020 L4MS), a three-finger HRC hand (Innovation Fund of Serbia), ACTICIPATE (MSCA-IF), and assistive robotics for children (III44008). Associate editor of the International Journal of Advanced Robotic Systems; review editor for humanoid robotics at Frontiers in Robotics and AI.

  [Curriculum vitae (PDF)](/media/cv/mirko-rakovic.pdf) · [Google Scholar](https://scholar.google.com/citations?user=hSUzJK0AAAAJ)
