role: Saradnik u nastavi · student master studija
bio: |
  Saradnik u nastavi na Katedri za mehatroniku, robotiku i automatizaciju, Departman za industrijsko inženjerstvo i menadžment, Fakultet tehničkih nauka, Univerzitet u Novom Sadu. Radi na taktilnim senzorima i sistemima za merenje sile, robotskim rukama i manipulatorima, i mobilnoj robotici.

  Diplomirao iz mehatronike (240 ESPB, 2024) na FTN-u. Od 2024. pohađa master studije elektrotehnike i računarstva, smer veštačka inteligencija i mašinsko učenje – robotika. Na EUROBOT-u osvojio prvo mesto 2022. i drugo mesto 2024. Koautor radova „Force-Sensitive Underactuated Three-Finger Robot Hand“ (Journal of Mechanisms and Robotics, 2026) i „Classification of Contact Type Based on the Magnetic Field Data for Tactile Sensor“ (RAAD 2026, Bratislava). Od 2025. član nacionalnog organizacionog odbora EUROBOT Srbija.
