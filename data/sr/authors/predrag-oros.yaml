role: Laboratorijski tehničar
bio: |
  Elektrotehničar i laboratorijski tehničar na Fakultetu tehničkih nauka Univerziteta u Novom Sadu, zaposlen tamo od 2011, sa više od 25 godina profesionalnog iskustva u industrijskoj automatizaciji, elektrotehničkom održavanju i implementaciji sistema automatizacije.

  Učestvovao je na više od 50 industrijskih projekata automatske obrade procesa i na više od 30 neindustrijskih projekata. Tehnička ekspertiza obuhvata automatizaciju procesa, industrijsku i mobilnu robotiku (AGV), pneumatiku i hidrauliku, modifikaciju dronova, mehaničke sisteme, Vicon sistem za snimanje pokreta, CNC obradu, 3D štampu i održavanje 3D štampača. Ranije tehničke pozicije u Victoria Oil, CAM d.o.o. i CAM Engineering d.o.o.; od 2024. i honorarni tehničar u Sigmoid d.o.o., Novi Sad. Podržava razvoj, implementaciju, testiranje i održavanje eksperimentalnih postavki i robotskih i automatizovanih sistema u istraživačkim projektima.
