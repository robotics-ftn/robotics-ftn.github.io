# Robotics Lab FTN — Hugo Blox site configuration
hugoblox:
  schema: "2.0"

  identity:
    name: "Robotics@FTN"
    organization: "Laboratory for Robotics and Mechatronics · FTN, University of Novi Sad"
    type: organization
    tagline: "Industrial manipulation, humanoid locomotion, and human–robot interaction — built and tested on real hardware."
    description: "The Laboratory for Robotics and Mechatronics at the Faculty of Technical Sciences (FTN), University of Novi Sad, develops humanoid robots, dexterous hands, industrial manipulation, and HRI systems. Led by prof. dr Mirko Raković."
    social:
      twitter: ""

  theme:
    mode: system
    pack: "robotics-lab"
    colors:
      primary: "#22d3ee"
      secondary: "#fb923c"
      neutral: "#111827"
    colors_dark: {}
    colors_light: {}
    surfaces:
      background: "#030712"
      foreground: "#f8fafc"

  typography:
    pack: "robotics-lab"

  layout:
    radius: "lg"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: true
    cta:
      enable: true
      text: "Join Us"
      url: "/join/"

  footer:
    style: minimal
    language_switcher: false
    text: ""

  copyright:
    notice: "© {year} {name}. Content from public FTN sources unless noted."
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  seo:
    title: "Robotics@FTN"
    location:
      address:
        street: "Trg Dositeja Obradovića 6"
        city: "Novi Sad"
        region: "Vojvodina"
        postal_code: "21102"
        country: "Serbia"
      coordinates:
        latitude: 45.2467
        longitude: 19.8517
      phone: "+381 21 485 2164"

  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: false
    citations:
      style: ieee

  search:
    enable: true
    suggestions:
      - "humanoid"
      - "industrial robotics"
      - "publications"

  repository:
    enable: true
    url: "https://github.com/robotics-ftn/robotics-ftn.github.io"
    branch: main
    content_dir: content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  pro:
    hide_attribution: false
