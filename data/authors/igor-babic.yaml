bio: |
  Teaching assistant at the Chair of Mechatronics, Robotics and Automation, Faculty of Technical Sciences, University of Novi Sad. B.S. in Mechatronics (2022) and M.S. (2023) from the same faculty; employed at FTN since 2022 and currently a PhD student in mechatronics.

  Teaching includes Industrial Robotics, Fundamentals of Product Development, Basics of Medical Robotics, and Rehabilitation Systems and Devices. Research interests: industrial robotics, robot control, robotic manipulators, and automation systems. Experience with industrial robots from ABB, Mitsubishi, Stäubli, and CLOOS, as well as PLC programming, industrial automation, and CAD/CAM. Co-author of papers at RAAD and IcETRAN.

  Involved in EUROBOT as a competitor and organizer. In 2025 he served as a referee at WorldSkills Serbia in Mechatronics.
