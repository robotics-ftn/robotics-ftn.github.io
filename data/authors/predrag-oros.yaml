bio: |
  Electrical and laboratory technician at the Faculty of Technical Sciences, University of Novi Sad, employed there since 2011, with more than 25 years of professional experience in industrial automation, electrical maintenance, and the implementation of automation systems.

  Work includes more than 50 industrial process-automation projects and over 30 non-industrial projects. Technical expertise covers process automation, industrial and mobile robotics (AGVs), pneumatics and hydraulics, drone modification, mechanical systems, Vicon motion capture, CNC machining, 3D printing, and 3D printer maintenance. Previous technical positions at Victoria Oil, CAM d.o.o., and CAM Engineering d.o.o.; since 2024 also a part-time technician at Sigmoid d.o.o., Novi Sad. Supports development, implementation, testing, and maintenance of experimental setups and robotic and automated systems in research projects.
