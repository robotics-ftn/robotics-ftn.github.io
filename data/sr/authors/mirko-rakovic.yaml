role: Redovni profesor · Rukovodilac Laboratorije za robotiku i mehatroniku
bio: |
  Rukovodi Laboratorijom za robotiku i mehatroniku na FTN-u. Istraživanja obuhvataju bipednu lokomociju, interakciju čovek–robot, anticipaciju akcija i dexterous FTN robot ruku za humanoid MARKO. Član IEEE; bivši postdoktorant na IST/ISR Lisabon (VisLab).
